<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <!-- Frame -->
  <rect x="20" y="20" width="240" height="160" rx="4" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Center divider -->
  <line x1="140" y1="20" x2="140" y2="180" stroke="#0f2942" stroke-width="3"/>
  <!-- Left panel (fixed - X) -->
  <rect x="28" y="28" width="104" height="144" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Right panel (slides - O) -->
  <rect x="148" y="28" width="104" height="144" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Lock on center rail -->
  <rect x="133" y="94" width="14" height="12" rx="3" fill="#0284c7" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
  <!-- Arrow showing slide direction -->
  <line x1="200" y1="190" x2="160" y2="190" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="155,190 163,186 163,194" fill="#0284c7"/>
  <!-- Labels -->
  <text x="80" y="14" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">Fixed</text>
  <text x="200" y="14" text-anchor="middle" font-size="11" fill="#0284c7" font-family="system-ui">Slides</text>
</svg>