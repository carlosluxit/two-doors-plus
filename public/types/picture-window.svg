<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" fill="none">
  <!-- Frame -->
  <rect x="20" y="20" width="220" height="160" rx="4" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Single pane (fixed) -->
  <rect x="30" y="30" width="200" height="140" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.4"/>
  <!-- Fixed indicator X -->
  <line x1="30" y1="30" x2="230" y2="170" stroke="#0284c7" stroke-width="0.5" opacity="0.2"/>
  <line x1="230" y1="30" x2="30" y2="170" stroke="#0284c7" stroke-width="0.5" opacity="0.2"/>
  <!-- Label -->
  <text x="130" y="108" text-anchor="middle" font-size="12" fill="#0284c7" font-family="system-ui" opacity="0.6">Fixed Glass</text>
</svg>