<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Frame -->
  <rect x="20" y="20" width="260" height="260" rx="3" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Center meeting rail -->
  <line x1="150" y1="20" x2="150" y2="280" stroke="#0f2942" stroke-width="3"/>
  <!-- Left door panel -->
  <rect x="30" y="30" width="112" height="240" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Left top glass -->
  <rect x="40" y="42" width="92" height="110" rx="3" stroke="#0284c7" stroke-width="1" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Left bottom panel -->
  <rect x="40" y="168" width="92" height="90" rx="3" stroke="#0284c7" stroke-width="1" fill="#0f2942" fill-opacity="0.05"/>
  <!-- Left handle -->
  <rect x="120" y="148" width="6" height="24" rx="3" fill="#0284c7" fill-opacity="0.4" stroke="#0284c7" stroke-width="1"/>
  <!-- Right door panel -->
  <rect x="158" y="30" width="112" height="240" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Right top glass -->
  <rect x="168" y="42" width="92" height="110" rx="3" stroke="#0284c7" stroke-width="1" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Right bottom panel -->
  <rect x="168" y="168" width="92" height="90" rx="3" stroke="#0284c7" stroke-width="1" fill="#0f2942" fill-opacity="0.05"/>
  <!-- Right handle -->
  <rect x="174" y="148" width="6" height="24" rx="3" fill="#0284c7" fill-opacity="0.4" stroke="#0284c7" stroke-width="1"/>
  <!-- Threshold -->
  <rect x="14" y="278" width="272" height="6" rx="2" fill="#0f2942" fill-opacity="0.1" stroke="#0f2942" stroke-width="1"/>
</svg>