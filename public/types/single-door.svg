<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 300" fill="none">
  <!-- Door frame -->
  <rect x="20" y="20" width="140" height="260" rx="3" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Door panel -->
  <rect x="30" y="30" width="120" height="240" rx="2" stroke="#0284c7" stroke-width="2" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Top glass panel -->
  <rect x="42" y="42" width="96" height="110" rx="3" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Horizontal glass divider -->
  <line x1="42" y1="97" x2="138" y2="97" stroke="#0284c7" stroke-width="1" opacity="0.5"/>
  <!-- Bottom raised panel -->
  <rect x="42" y="168" width="96" height="90" rx="3" stroke="#0284c7" stroke-width="1" fill="#0f2942" fill-opacity="0.05"/>
  <!-- Door handle -->
  <rect x="126" y="148" width="6" height="24" rx="3" fill="#0284c7" fill-opacity="0.4" stroke="#0284c7" stroke-width="1"/>
  <!-- Threshold -->
  <rect x="14" y="278" width="152" height="6" rx="2" fill="#0f2942" fill-opacity="0.1" stroke="#0f2942" stroke-width="1"/>
  <!-- Hinge indicators -->
  <rect x="22" y="60" width="4" height="14" rx="2" fill="#0284c7" fill-opacity="0.3"/>
  <rect x="22" y="180" width="4" height="14" rx="2" fill="#0284c7" fill-opacity="0.3"/>
</svg>