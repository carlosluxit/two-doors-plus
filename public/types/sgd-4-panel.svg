<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none">
  <!-- Frame -->
  <rect x="20" y="20" width="440" height="240" rx="3" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Dividers -->
  <line x1="130" y1="20" x2="130" y2="260" stroke="#0f2942" stroke-width="3"/>
  <line x1="240" y1="20" x2="240" y2="260" stroke="#0f2942" stroke-width="3"/>
  <line x1="350" y1="20" x2="350" y2="260" stroke="#0f2942" stroke-width="3"/>
  <!-- Panel 1 (fixed - X) -->
  <rect x="28" y="28" width="94" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Panel 2 (slides - O) -->
  <rect x="138" y="28" width="94" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Panel 3 (slides - O) -->
  <rect x="248" y="28" width="94" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Panel 4 (fixed - X) -->
  <rect x="358" y="28" width="94" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Track -->
  <line x1="28" y1="258" x2="452" y2="258" stroke="#0f2942" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="75" y="14" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">Fixed</text>
  <text x="185" y="14" text-anchor="middle" font-size="10" fill="#0284c7" font-family="system-ui">Slides</text>
  <text x="295" y="14" text-anchor="middle" font-size="10" fill="#0284c7" font-family="system-ui">Slides</text>
  <text x="405" y="14" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">Fixed</text>
</svg>