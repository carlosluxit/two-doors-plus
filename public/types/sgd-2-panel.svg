<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" fill="none">
  <!-- Frame -->
  <rect x="20" y="20" width="260" height="240" rx="3" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Center rail -->
  <line x1="150" y1="20" x2="150" y2="260" stroke="#0f2942" stroke-width="3"/>
  <!-- Left panel (fixed) -->
  <rect x="28" y="28" width="114" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Right panel (slides) -->
  <rect x="158" y="28" width="114" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Handle -->
  <rect x="141" y="130" width="18" height="26" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Track lines -->
  <line x1="28" y1="258" x2="272" y2="258" stroke="#0f2942" stroke-width="1.5"/>
  <line x1="28" y1="255" x2="272" y2="255" stroke="#0f2942" stroke-width="0.5" opacity="0.4"/>
  <!-- Slide arrow -->
  <line x1="215" y1="270" x2="175" y2="270" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="170,270 178,266 178,274" fill="#0284c7"/>
  <!-- Labels -->
  <text x="85" y="14" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">Fixed</text>
  <text x="215" y="14" text-anchor="middle" font-size="10" fill="#0284c7" font-family="system-ui">Slides</text>
</svg>