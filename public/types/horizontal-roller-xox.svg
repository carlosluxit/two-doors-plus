<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <!-- Frame -->
  <rect x="20" y="20" width="320" height="160" rx="4" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Dividers -->
  <line x1="133" y1="20" x2="133" y2="180" stroke="#0f2942" stroke-width="3"/>
  <line x1="247" y1="20" x2="247" y2="180" stroke="#0f2942" stroke-width="3"/>
  <!-- Left panel (fixed - X) -->
  <rect x="28" y="28" width="97" height="144" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Center panel (slides - O) -->
  <rect x="141" y="28" width="98" height="144" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Right panel (fixed - X) -->
  <rect x="255" y="28" width="77" height="144" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Labels -->
  <text x="76" y="14" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">Fixed</text>
  <text x="190" y="14" text-anchor="middle" font-size="10" fill="#0284c7" font-family="system-ui">Slides</text>
  <text x="293" y="14" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">Fixed</text>
</svg>