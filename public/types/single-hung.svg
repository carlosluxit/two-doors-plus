<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- Frame -->
  <rect x="20" y="20" width="160" height="240" rx="4" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Center rail -->
  <line x1="20" y1="140" x2="180" y2="140" stroke="#0f2942" stroke-width="3"/>
  <!-- Top sash (fixed) -->
  <rect x="28" y="28" width="144" height="104" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Top sash divider -->
  <line x1="100" y1="28" x2="100" y2="132" stroke="#0284c7" stroke-width="1"/>
  <!-- Bottom sash (slides up) -->
  <rect x="28" y="148" width="144" height="104" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Bottom sash divider -->
  <line x1="100" y1="148" x2="100" y2="252" stroke="#0284c7" stroke-width="1"/>
  <!-- Lock -->
  <rect x="92" y="134" width="16" height="12" rx="3" fill="#0284c7" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
  <!-- Arrow showing slide direction -->
  <line x1="188" y1="200" x2="188" y2="160" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="188,155 184,163 192,163" fill="#0284c7"/>
</svg>