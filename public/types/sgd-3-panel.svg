<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- Frame -->
  <rect x="20" y="20" width="360" height="240" rx="3" stroke="#0f2942" stroke-width="3" fill="#f0f9ff"/>
  <!-- Dividers -->
  <line x1="147" y1="20" x2="147" y2="260" stroke="#0f2942" stroke-width="3"/>
  <line x1="253" y1="20" x2="253" y2="260" stroke="#0f2942" stroke-width="3"/>
  <!-- Left panel (fixed - X) -->
  <rect x="28" y="28" width="111" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Center panel (slides - O) -->
  <rect x="155" y="28" width="90" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.3"/>
  <!-- Right panel (fixed - X) -->
  <rect x="261" y="28" width="111" height="224" rx="2" stroke="#0284c7" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.5"/>
  <!-- Track -->
  <line x1="28" y1="258" x2="372" y2="258" stroke="#0f2942" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="83" y="14" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">Fixed</text>
  <text x="200" y="14" text-anchor="middle" font-size="10" fill="#0284c7" font-family="system-ui">Slides</text>
  <text x="316" y="14" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">Fixed</text>
</svg>